name: HRMS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/HRMS.sln

      - name: Build Solution
        run: dotnet build backend/HRMS.sln --no-restore -c Release

      - name: Run Tests
        run: dotnet test backend/HRMS.sln --no-build --verbosity normal

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  docker-build-verify:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Gateway Image
        run: docker build -t hrms-gateway:latest -f backend/gateway/Dockerfile .

      - name: Build HR Core Image
        run: docker build -t hrms-hr-core:latest -f backend/services/hr-core/Dockerfile .

      - name: Build Attendance Image
        run: docker build -t hrms-attendance:latest -f backend/services/attendance/Dockerfile .

      - name: Build Payroll Report Image
        run: docker build -t hrms-payroll-report:latest -f backend/services/payroll-report/Dockerfile .
