version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hrms-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Hrms@123456789
    ports:
      - "1434:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hrms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest

  hr-core:
    image: hrms-hr-core:latest
    build:
      context: .
      dockerfile: backend/services/hr-core/Dockerfile
    container_name: hrms-hr-core
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=HRMS_HrCoreDb;User Id=sa;Password=Hrms@123456789;TrustServerCertificate=True
      - RabbitMQ__Host=rabbitmq
      - JwtSettings__Secret=hrms-jwt-super-secret-key-1234567890123456
    depends_on:
      - sqlserver
      - rabbitmq

  attendance:
    image: hrms-attendance:latest
    build:
      context: .
      dockerfile: backend/services/attendance/Dockerfile
    container_name: hrms-attendance
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=HRMS_AttendanceDb;User Id=sa;Password=Hrms@123456789;TrustServerCertificate=True
      - RabbitMQ__Host=rabbitmq
      - JwtSettings__Secret=hrms-jwt-super-secret-key-1234567890123456
    depends_on:
      - sqlserver
      - rabbitmq

  payroll-report:
    image: hrms-payroll-report:latest
    build:
      context: .
      dockerfile: backend/services/payroll-report/Dockerfile
    container_name: hrms-payroll-report
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=HRMS_PayrollReportDb;User Id=sa;Password=Hrms@123456789;TrustServerCertificate=True
      - RabbitMQ__Host=rabbitmq
      - JwtSettings__Secret=hrms-jwt-super-secret-key-1234567890123456
    depends_on:
      - sqlserver
      - rabbitmq

  gateway:
    image: hrms-gateway:latest
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    container_name: hrms-gateway
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ReverseProxy__Clusters__hr-core-cluster__Destinations__hr-core-api__Address=http://hr-core:8080/
      - ReverseProxy__Clusters__attendance-cluster__Destinations__attendance-api__Address=http://attendance:8080/
      - ReverseProxy__Clusters__payroll-cluster__Destinations__payroll-api__Address=http://payroll-report:8080/
      - Cors__AllowedOrigins__0=http://localhost:5173
    depends_on:
      - hr-core
      - attendance
      - payroll-report
  frontend:
    image: hrms-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrms-frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway
volumes:
  mssql-data: